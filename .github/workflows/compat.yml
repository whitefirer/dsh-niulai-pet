name: compat

# dsh 更新时的兼容性巡检：
# 每天 03:00 UTC（北京时间 11:00）检查一次 npm 上的 @deepseek-ai/dsh@latest；
# 也可以手动指定版本。失败会在 ubuntu 作业里开/追加一个 issue 通知你。
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh version to test (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [master]
    paths:
      - 'index.js'
      - 'package.json'
      - 'lib/client.js'
      - 'src/client/**'
      - 'tools/compat/**'
      - '.github/workflows/compat.yml'

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compat:
    name: compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # dsh plugin add 会转发给 pnpm；GitHub runner 默认没有 pnpm。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dsh CLI
        shell: bash
        run: |
          npm config set prefix "$HOME/.npm-global"
          npm install -g "@deepseek-ai/dsh@${{ inputs.dsh_version || 'latest' }}"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          dsh --version

      - name: Compatibility check
        shell: bash
        run: |
          node tools/compat/check.mjs --report "$RUNNER_TEMP/compat-report-${{ matrix.os }}.md"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/compat-report-${{ matrix.os }}.md
            ${{ runner.temp }}/compat-report-${{ matrix.os }}.md.log
          if-no-files-found: ignore

  ui:
    name: ui smoke (ubuntu-latest)
    # 只在定时/手动时跑；push 只跑 host 检查，避免每次提交多 2-3 分钟。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dsh CLI
        shell: bash
        run: |
          npm config set prefix "$HOME/.npm-global"
          npm install -g "@deepseek-ai/dsh@${{ inputs.dsh_version || 'latest' }}"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          dsh --version

      - name: Install Playwright + Chromium
        shell: bash
        env:
          # playwright 包的 postinstall 不要下三个浏览器，只装 chromium。
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: UI smoke
        shell: bash
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-ui-home"
          # --dump-config 会因 profile 里其它 bundle 的 schema 限制返回非零；模板落盘才是目的。
          dsh --profile compat --from-default-profile web --dump-config >/dev/null 2>&1 || true
          dsh plugin --profile compat add "file:$GITHUB_WORKSPACE" >/dev/null
          dsh --profile compat --no-open --port 0 >"$RUNNER_TEMP/dsh-ui.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          url=""
          for _ in $(seq 1 60); do
            # set -e + pipefail 下，grep 没命中不能让脚本直接退出。
            url="$(grep -o 'dsh web: http://[^ ]*' "$RUNNER_TEMP/dsh-ui.log" | head -1 | sed 's/^dsh web: //' || true)"
            if [ -n "$url" ]; then break; fi
            sleep 1
          done
          if [ -z "$url" ]; then
            echo 'dsh web did not print its token URL'
            tail -80 "$RUNNER_TEMP/dsh-ui.log"
            exit 1
          fi
          node tools/compat/ui.mjs --url "$url" --report "$RUNNER_TEMP/ui-report.md"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-ubuntu-latest
          path: |
            ${{ runner.temp }}/ui-report.md
            ${{ runner.temp }}/ui-report.md.png
            ${{ runner.temp }}/dsh-ui.log
          if-no-files-found: ignore

  notify:
    name: open issue on failure
    needs: [compat, ui]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[compat] dsh 兼容检查失败'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'dsh 兼容检查失败。',
              '',
              `- 运行：${runUrl}`,
              `- 触发：${context.eventName}`,
              '',
              '请下载本次运行 artifacts 里的 `compat-report-*` / `ui-report-*` 查看 entry 状态、诊断和页面错误；',
              '修复后重跑 `compat` workflow（成功时会自动关闭这个 issue）。',
            ].join('\n')
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }

  close-issue:
    name: close issue on success
    needs: [compat, ui]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[compat] dsh 兼容检查失败'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title)
            if (!existing) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `兼容检查已恢复（${runUrl}），自动关闭。`,
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            })
